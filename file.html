<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; display: flex; height: 100vh; }

    /* 2/3 Left Side */
    .calendar-pane { flex: 2; padding: 20px; overflow-y: auto; border-right: 2px solid #eee; }
    
    /* 1/3 Right Side */
    .ai-pane { flex: 1; padding: 20px; background: #f9f9f9; display: flex; flex-direction: column; }
    .chat-box { flex: 1; background: white; border: 1px solid #ccc; padding: 10px; overflow-y: auto; margin-bottom: 10px; border-radius: 6px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .card { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="calendar-pane">
    <h2>Classes & Assignments</h2>
    <div id="events-list">Loading events...</div>
  </div>

  <div class="ai-pane">
    <h2>Socratic AI Tutor</h2>
    <div class="chat-box" id="chat-box">
      <p style="color: blue;"><strong>AI Tutor:</strong> Hi! What topic are we reviewing today?</p>
    </div>
    <input type="text" id="ai-input" placeholder="Type here and press Enter..." />
  </div>

  <script>
    const CALENDAR_URL = "https://flintridgeprep.myschoolapp.com/podium/feed/iCal.aspx?z=OivLQPLJOKYMGyGIqYC3M7bNmNWSFfU3Ym59A45ngOCUcmEBedAXB8DpfHJyiXPuVp9jhNsYtz7VkYxrqeVc5A%3d%3d";

    // 1. Fetch & Parse iCal Data in native JS
    async function fetchCalendar() {
      const container = document.getElementById("events-list");
      try {
        const proxyUrl = "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(CALENDAR_URL);
        const res = await fetch(proxyUrl);
        const text = await res.text();

        // Simple parser extracting SUMMARY lines
        const lines = text.split("\n");
        let html = "";
        
        lines.forEach(line => {
          if (line.startsWith("SUMMARY:")) {
            const title = line.replace("SUMMARY:", "").trim();
            html += `<div class="card"><h3>${title}</h3></div>`;
          }
        });

        container.innerHTML = html || "<p>No events found.</p>";
      } catch (err) {
        container.innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
      }
    }

    // 2. Chat Input Handler
    document.getElementById("ai-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && e.target.value.trim() !== "") {
        const chatBox = document.getElementById("chat-box");
        const userMsg = e.target.value.trim();

        chatBox.innerHTML += `<p><strong>You:</strong> ${userMsg}</p>`;
        e.target.value = "";

        // Socratic Teaching Prompt Logic
        const reply = "Great start! What is the first concept or formula you think applies here?";
        chatBox.innerHTML += `<p style="color: blue;"><strong>AI Tutor:</strong> ${reply}</p>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    });

    fetchCalendar();
  </script>
</body>
</html>
